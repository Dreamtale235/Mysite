<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Holy Grail">
  <title>Holy Grail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #10100f;
      --paper: #f3f0e9;
      --muted: #c9c5bc;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: clamp(2rem, 8vw, 6rem) 1.5rem;
      background: var(--ink);
      color: var(--paper);
      text-align: center;
    }

    main {
      display: grid;
      justify-items: center;
      gap: 1rem;
    }

    h1, p { margin: 0; }

    h1 {
      font-family: "Cormorant Garamond", Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif;
      font-size: clamp(4rem, 13vw, 9rem);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    p {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--muted);
      font-size: clamp(0.875rem, 1.5vw, 1rem);
      font-weight: 400;
      letter-spacing: 0.03em;
      line-height: 1.5;
    }

    p:last-child {
      margin-top: 1.25rem;
      color: var(--paper);
      font-weight: 500;
    }

    .portal-entry {
      position: fixed;
      bottom: clamp(1.5rem, 4vw, 2.5rem);
      left: 50%;
      display: grid;
      width: 3rem;
      height: 3rem;
      place-items: center;
      transform: translateX(-50%);
      color: var(--muted);
      font-family: "Segoe UI Symbol", "Apple Symbols", sans-serif;
      font-size: 1.7rem;
      line-height: 1;
      text-decoration: none;
    }

    .portal-entry:hover {
      color: var(--paper);
    }

    .portal-entry:focus-visible {
      outline: 1px solid var(--paper);
      outline-offset: 0.25rem;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <main>
    <h1>Holy Grail</h1>
    <p>Found on 29 September 2026.</p>
    <p>You made it to the top.</p>
  </main>
  <a class="portal-entry" href="/start/" aria-label="Enter the start page">⊙</a>
</body>
</html>
