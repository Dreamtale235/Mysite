<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Holy Grail start page">
  <title>Holy Grail — Start</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #10100f;
      --paper: #f3f0e9;
      --muted: #c9c5bc;
      --line: rgba(243, 240, 233, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: clamp(2rem, 8vw, 6rem) 1.5rem;
      background: var(--ink);
      color: var(--paper);
    }

    main {
      width: min(100%, 38rem);
      text-align: center;
    }

    h1, h2, p, time { margin: 0; }

    h1 {
      color: var(--muted);
      font-family: "Cormorant Garamond", Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif;
      font-size: clamp(2.25rem, 7vw, 4rem);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1;
    }

    .greeting {
      margin-top: clamp(2.5rem, 8vw, 4.5rem);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(0.8rem, 1.3vw, 0.9rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    time {
      display: block;
      margin-top: 0.65rem;
      font-family: Fraunces, Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif;
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 0.9;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      margin-top: clamp(3rem, 9vw, 5rem);
    }

    a {
      display: grid;
      min-height: 4.5rem;
      place-items: center;
      padding: 1rem;
      border: 1px solid var(--line);
      color: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-decoration: none;
    }

    a:hover {
      border-color: var(--paper);
    }

    a:focus-visible {
      outline: 1px solid var(--paper);
      outline-offset: 0.25rem;
    }

    @media (max-width: 32rem) {
      nav { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Holy Grail</h1>
    <p class="greeting" id="greeting">Good morning</p>
    <time id="local-time" aria-live="polite"></time>
    <nav aria-label="Quick links">
      <a href="https://chatgpt.com">ChatGPT</a>
      <a href="https://github.com/Dreamtale235">GitHub</a>
      <a href="https://www.google.com">Google</a>
    </nav>
  </main>
  <script>
    const greeting = document.querySelector("#greeting");
    const localTime = document.querySelector("#local-time");
    const timeFormatter = new Intl.DateTimeFormat(undefined, {
      hour: "numeric",
      minute: "2-digit"
    });

    function updateClock() {
      const now = new Date();
      const hour = now.getHours();
      greeting.textContent = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
      localTime.dateTime = now.toISOString();
      localTime.textContent = timeFormatter.format(now);
    }

    function scheduleClockUpdate() {
      const now = new Date();
      const delay = 60000 - (now.getSeconds() * 1000 + now.getMilliseconds());
      window.setTimeout(() => {
        updateClock();
        scheduleClockUpdate();
      }, delay);
    }

    updateClock();
    scheduleClockUpdate();
  </script>
</body>
</html>
