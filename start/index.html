<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Holy Grail start page">
  <title>Holy Grail — Start</title>
  <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #10100f;
      --paper: #f3f0e9;
      --muted: #c9c5bc;
      --line: rgba(243, 240, 233, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: clamp(2rem, 8vw, 6rem) 1.5rem;
      background: var(--ink);
      color: var(--paper);
    }

    main {
      width: min(100%, 38rem);
      text-align: center;
    }

    h1, h2, p, time { margin: 0; }

    h1 {
      color: var(--muted);
      font-family: "Cormorant Garamond", Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif;
      font-size: clamp(2.25rem, 7vw, 4rem);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1;
    }

    .greeting {
      margin-top: clamp(3rem, 9vw, 5rem);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(0.8rem, 1.3vw, 0.9rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    time {
      display: block;
      margin-top: 0.85rem;
      font-family: Fraunces, Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif;
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 500;
      letter-spacing: -0.015em;
      line-height: 0.9;
    }

    .weather {
      min-height: 5.75rem;
      margin-top: clamp(1.7rem, 5vw, 2.4rem);
      padding-top: clamp(1.2rem, 3vw, 1.6rem);
      border-top: 1px solid var(--line);
    }

    .weather-primary {
      color: var(--paper);
      font-family: Fraunces, Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif;
      font-size: clamp(1.4rem, 3vw, 1.85rem);
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 1.1;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .weather-details {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem 0.9rem;
      margin-top: 0.85rem;
      color: var(--muted);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(0.7rem, 1.2vw, 0.76rem);
      font-weight: 400;
      letter-spacing: 0.055em;
      line-height: 1.5;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .weather.is-pending .weather-primary,
    .weather.is-unavailable .weather-primary {
      opacity: 0.45;
    }

    .weather:not(.is-ready) .weather-details {
      visibility: hidden;
      opacity: 0;
      transform: translateY(0.4rem);
    }

    .weather.is-ready .weather-primary,
    .weather.is-ready .weather-details {
      opacity: 1;
      transform: translateY(0);
    }

    .search {
      position: relative;
      margin-top: clamp(2.25rem, 6vw, 3rem);
    }

    .search label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 1.1rem;
      width: 1rem;
      height: 1rem;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      min-height: 3.5rem;
      padding: 0 1.1rem 0 3.2rem;
      border: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--paper);
      font: 400 clamp(0.72rem, 3vw, 0.85rem)/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.035em;
    }

    .search input::placeholder {
      color: var(--muted);
      font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
      letter-spacing: 0;
      opacity: 1;
    }

    .search input:hover,
    .search input:focus {
      border-color: var(--paper);
    }

    .search input:focus-visible {
      outline: 1px solid var(--paper);
      outline-offset: 0.25rem;
    }

    .almanac-entry {
      display: inline-block;
      margin-top: 1.15rem;
      color: var(--muted);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(0.68rem, 1.2vw, 0.74rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .almanac-entry:hover { color: var(--paper); }

    .almanac-entry:focus-visible {
      outline: 1px solid var(--paper);
      outline-offset: 0.25rem;
    }

    .portal-entry {
      position: fixed;
      bottom: max(clamp(1.5rem, 4vw, 2.5rem), env(safe-area-inset-bottom));
      left: 50%;
      display: grid;
      width: 3rem;
      height: 3rem;
      place-items: center;
      transform: translateX(-50%);
      color: var(--muted);
      font-family: "Segoe UI Symbol", "Apple Symbols", sans-serif;
      font-size: 1.7rem;
      line-height: 1;
      text-decoration: none;
    }

    .portal-entry:hover {
      color: var(--paper);
    }

    .portal-entry:focus-visible {
      outline: 1px solid var(--paper);
      outline-offset: 0.25rem;
      border-radius: 50%;
    }

    @media (max-width: 32rem) {
      .weather { min-height: 7rem; }

      .weather-details { gap: 0.4rem 0.7rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .weather-primary,
      .weather-details {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Holy Grail</h1>
    <p class="greeting" id="greeting">Good morning</p>
    <time id="local-time" aria-live="polite"></time>
    <section class="weather is-pending" id="weather" aria-live="polite" aria-busy="true">
      <p class="weather-primary" id="weather-primary">— · —</p>
      <p class="weather-details" aria-hidden="true">
        <span id="weather-high"></span>
        <span id="weather-low"></span>
        <span id="weather-rain"></span>
        <span id="weather-humidity"></span>
        <span id="weather-wind"></span>
      </p>
    </section>
    <form class="search" action="https://www.google.com/search" method="get" role="search">
      <label for="search-query">Search Google</label>
      <svg class="search-icon" aria-hidden="true" focusable="false" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="6.5" cy="6.5" r="4.25"></circle>
        <path d="m9.75 9.75 3.25 3.25"></path>
      </svg>
      <input id="search-query" name="q" type="search" placeholder="事不目见耳闻，而臆断其有无，可乎？" autocomplete="off" enterkeyhint="search">
    </form>
    <a class="almanac-entry" href="/almanac/">Almanac</a>
  </main>
  <a class="portal-entry" href="/" aria-label="Return to Holy Grail">⊙</a>
  <script>
    const greeting = document.querySelector("#greeting");
    const localTime = document.querySelector("#local-time");
    const weather = document.querySelector("#weather");
    const weatherPrimary = document.querySelector("#weather-primary");
    const weatherDetails = document.querySelector(".weather-details");
    const weatherHigh = document.querySelector("#weather-high");
    const weatherLow = document.querySelector("#weather-low");
    const weatherRain = document.querySelector("#weather-rain");
    const weatherHumidity = document.querySelector("#weather-humidity");
    const weatherWind = document.querySelector("#weather-wind");
    const search = document.querySelector(".search");
    const searchQuery = document.querySelector("#search-query");
    const timeFormatter = new Intl.DateTimeFormat(undefined, {
      hour: "numeric",
      minute: "2-digit"
    });

    function updateClock() {
      const now = new Date();
      const hour = now.getHours();
      greeting.textContent = hour < 5 ? "Good night" : hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
      localTime.dateTime = now.toISOString();
      localTime.textContent = timeFormatter.format(now);
    }

    function scheduleClockUpdate() {
      const now = new Date();
      const delay = 60000 - (now.getSeconds() * 1000 + now.getMilliseconds());
      window.setTimeout(() => {
        updateClock();
        scheduleClockUpdate();
      }, delay);
    }

    function weatherDescription(code, isDay) {
      if (code === 0) return { icon: isDay ? "☀" : "☾", label: "Clear" };
      if (code <= 3) return { icon: "☁", label: code === 3 ? "Overcast" : "Cloudy" };
      if ([45, 48].includes(code)) return { icon: "≋", label: "Fog" };
      if ([51, 53, 55, 56, 57].includes(code)) return { icon: "☂", label: "Drizzle" };
      if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { icon: "☂", label: "Rain" };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { icon: "❄", label: "Snow" };
      if ([95, 96, 99].includes(code)) return { icon: "ϟ", label: "Thunderstorm" };
      return { icon: "•", label: "Weather" };
    }

    function rounded(value) {
      return Math.round(value);
    }

    function showWeather(data) {
      const current = data.current;
      const daily = data.daily;
      if (!current || !daily) return;

      const condition = weatherDescription(current.weather_code, current.is_day === 1);
      weatherPrimary.textContent = `${condition.icon} ${rounded(current.temperature_2m)}°C · ${condition.label}`;
      weatherHigh.textContent = `H ${rounded(daily.temperature_2m_max[0])}°`;
      weatherLow.textContent = `L ${rounded(daily.temperature_2m_min[0])}°`;
      weatherRain.textContent = `Rain ${rounded(daily.precipitation_probability_max[0])}%`;
      weatherHumidity.textContent = `Humidity ${rounded(current.relative_humidity_2m)}%`;
      weatherWind.textContent = `Wind ${rounded(current.wind_speed_10m)} km/h`;
      weather.setAttribute("aria-busy", "false");
      weatherDetails.setAttribute("aria-hidden", "false");

      if (!weather.classList.contains("is-ready")) {
        weather.classList.remove("is-unavailable");
        weather.classList.add("is-pending");
        window.requestAnimationFrame(() => {
          weather.classList.remove("is-pending");
          weather.classList.add("is-ready");
        });
      }
    }

    function keepWeatherPlaceholder() {
      if (weather.classList.contains("is-ready")) return;
      weatherPrimary.textContent = "— · —";
      weather.setAttribute("aria-busy", "false");
      weather.classList.remove("is-pending");
      weather.classList.add("is-unavailable");
    }

    function startWeather(latitude, longitude) {
      const query = new URLSearchParams({
        latitude,
        longitude,
        current: "temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day",
        daily: "temperature_2m_max,temperature_2m_min,precipitation_probability_max",
        forecast_days: "1",
        temperature_unit: "celsius",
        wind_speed_unit: "kmh",
        timezone: "auto"
      });

      async function refreshWeather() {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 10000);
        try {
          const response = await fetch(`https://api.open-meteo.com/v1/forecast?${query}`, { signal: controller.signal });
          if (!response.ok) throw new Error("Weather request failed");
          showWeather(await response.json());
        } catch {
          keepWeatherPlaceholder();
        } finally {
          window.clearTimeout(timeout);
        }
      }

      refreshWeather();
      window.setInterval(refreshWeather, 15 * 60 * 1000);
    }

    function initialiseWeather() {
      if (!navigator.geolocation) {
        keepWeatherPlaceholder();
        return;
      }
      navigator.geolocation.getCurrentPosition(
        ({ coords }) => startWeather(coords.latitude, coords.longitude),
        keepWeatherPlaceholder,
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 15 * 60 * 1000 }
      );
    }

    function handleSearchSubmit(event) {
      const query = searchQuery.value.trim();
      if (query === "/Dreamtale235" || query === "/Dreamtale235/") {
        event.preventDefault();
        window.location.assign("/Dreamtale235/");
      }
    }

    updateClock();
    scheduleClockUpdate();
    initialiseWeather();
    search.addEventListener("submit", handleSearchSubmit);
  </script>
</body>
</html>
