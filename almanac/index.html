<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Holy Grail daily almanac">
  <title>Holy Grail — Almanac</title>
  <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Serif:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #10100f;
      --paper: #f3f0e9;
      --muted: #c9c5bc;
      --line: rgba(243, 240, 233, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      padding: clamp(3rem, 8vw, 6rem) 1.5rem max(clamp(5rem, 10vw, 7rem), env(safe-area-inset-bottom));
      background: var(--ink);
      color: var(--paper);
    }

    main {
      width: min(100%, 48rem);
      margin: 0 auto;
      text-align: center;
    }

    h1, h2, p, dl, dd { margin: 0; }

    h1 {
      color: var(--paper);
      font-family: "Noto Serif", Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif;
      font-size: clamp(3.25rem, 10vw, 6.5rem);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 0.95;
    }

    .solar-date {
      margin-top: 1.35rem;
      color: var(--muted);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(0.78rem, 1.5vw, 0.92rem);
      font-weight: 500;
      letter-spacing: 0.1em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .lunar-date {
      margin-top: clamp(2.75rem, 7vw, 4.25rem);
      font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
      font-size: clamp(1.85rem, 5vw, 2.75rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.35;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      margin-top: clamp(1.8rem, 4vw, 2.5rem);
      padding: clamp(1.25rem, 3vw, 1.75rem) 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .details div { min-width: 0; }

    dt {
      color: var(--muted);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    dd {
      margin-top: 0.55rem;
      color: var(--paper);
      font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
      font-size: clamp(0.88rem, 2vw, 1rem);
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .activities {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(2rem, 8vw, 5.5rem);
      margin-top: clamp(2.5rem, 7vw, 4.25rem);
      text-align: left;
    }

    .activity {
      min-width: 0;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
    }

    h2 {
      color: var(--muted);
      font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.18em;
    }

    .activity-summary {
      margin-top: 1rem;
      font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
      font-size: clamp(1rem, 2.25vw, 1.15rem);
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .activity details { margin-top: 1rem; }

    .activity summary {
      color: var(--muted);
      cursor: pointer;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      line-height: 1.5;
    }

    .activity summary:hover { color: var(--paper); }

    .activity summary:focus-visible {
      outline: 1px solid var(--paper);
      outline-offset: 0.25rem;
    }

    .activity-original {
      margin-top: 0.75rem;
      color: var(--muted);
      font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
      font-size: clamp(0.82rem, 1.8vw, 0.92rem);
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .portal-entry {
      position: fixed;
      bottom: max(clamp(1.5rem, 4vw, 2.5rem), env(safe-area-inset-bottom));
      left: 50%;
      display: grid;
      width: 3rem;
      height: 3rem;
      place-items: center;
      transform: translateX(-50%);
      color: var(--muted);
      font-family: "Segoe UI Symbol", "Apple Symbols", sans-serif;
      font-size: 1.7rem;
      line-height: 1;
      text-decoration: none;
    }

    .portal-entry:hover { color: var(--paper); }

    .portal-entry:focus-visible {
      outline: 1px solid var(--paper);
      outline-offset: 0.25rem;
      border-radius: 50%;
    }

    @media (max-width: 34rem) {
      .details { grid-template-columns: 1fr; gap: 1.1rem; }
      .activities { grid-template-columns: 1fr; gap: 2rem; }
      .activity { text-align: center; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Almanac</h1>
    <p class="solar-date" id="solar-date" aria-live="polite">—</p>
    <p class="lunar-date" id="lunar-date">—</p>

    <dl class="details" aria-live="polite">
      <div>
        <dt>农历</dt>
        <dd id="lunar-year">—</dd>
      </div>
      <div>
        <dt>干支</dt>
        <dd id="ganzhi">—</dd>
      </div>
      <div>
        <dt>生肖</dt>
        <dd id="zodiac">—</dd>
      </div>
    </dl>

    <section class="activities" aria-live="polite">
      <section class="activity" aria-labelledby="yi-heading">
        <h2 id="yi-heading">宜</h2>
        <p class="activity-summary" id="yi-summary">—</p>
        <details>
          <summary>查看传统用语</summary>
          <p class="activity-original" id="yi-original">—</p>
        </details>
      </section>
      <section class="activity" aria-labelledby="ji-heading">
        <h2 id="ji-heading">忌</h2>
        <p class="activity-summary" id="ji-summary">—</p>
        <details>
          <summary>查看传统用语</summary>
          <p class="activity-original" id="ji-original">—</p>
        </details>
      </section>
    </section>
  </main>
  <a class="portal-entry" href="/start/" aria-label="Return to the start page">⊙</a>
  <script src="/assets/lunar-1.7.7.min.js"></script>
  <script>
    const solarDate = document.querySelector("#solar-date");
    const lunarDate = document.querySelector("#lunar-date");
    const lunarYear = document.querySelector("#lunar-year");
    const ganzhi = document.querySelector("#ganzhi");
    const zodiac = document.querySelector("#zodiac");
    const yiSummary = document.querySelector("#yi-summary");
    const yiOriginal = document.querySelector("#yi-original");
    const jiSummary = document.querySelector("#ji-summary");
    const jiOriginal = document.querySelector("#ji-original");

    const dateFormatter = new Intl.DateTimeFormat("en-GB", {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    });

    const activityGroups = Object.freeze({
      "祭祀": "仪式与亲友",
      "祈福": "仪式与亲友",
      "斋醮": "仪式与亲友",
      "酬神": "仪式与亲友",
      "开光": "仪式与亲友",
      "冠笄": "仪式与亲友",
      "嫁娶": "仪式与亲友",
      "订盟": "仪式与亲友",
      "纳采": "仪式与亲友",
      "会亲友": "仪式与亲友",
      "进人口": "仪式与亲友",
      "求嗣": "仪式与亲友",
      "出行": "出行与事务",
      "会友": "出行与事务",
      "移徙": "居家与生活",
      "入宅": "居家与生活",
      "安床": "居家与生活",
      "安门": "居家与生活",
      "安香": "居家与生活",
      "出火": "居家与生活",
      "作灶": "居家与生活",
      "扫舍": "居家与生活",
      "拆卸": "居家与生活",
      "解除": "居家与生活",
      "修饰垣墙": "居家与生活",
      "补垣": "居家与生活",
      "塞穴": "居家与生活",
      "开市": "出行与事务",
      "开业": "出行与事务",
      "交易": "出行与事务",
      "立券": "出行与事务",
      "纳财": "出行与事务",
      "挂匾": "出行与事务",
      "求财": "出行与事务",
      "开仓": "出行与事务",
      "纳畜": "出行与事务",
      "栽种": "出行与事务",
      "牧养": "出行与事务",
      "开渠": "工程与土地",
      "伐木": "工程与土地",
      "掘井": "工程与土地",
      "开池": "工程与土地",
      "破土": "工程与土地",
      "动土": "工程与土地",
      "修造": "工程与土地",
      "起基": "工程与土地",
      "上梁": "工程与土地",
      "竖柱": "工程与土地",
      "安葬": "纪念与告别",
      "启钻": "纪念与告别",
      "修坟": "纪念与告别",
      "立碑": "纪念与告别",
      "除服": "纪念与告别",
      "成服": "纪念与告别",
      "理发": "个人照料",
      "沐浴": "个人照料",
      "求医": "个人照料",
      "针灸": "个人照料",
      "入学": "出行与事务",
      "习艺": "出行与事务",
      "余事勿取": "无特别事项",
      "诸事不宜": "无特别事项",
      "无": "无特别事项"
    });

    function activitySummary(activities) {
      const groups = [];
      for (const activity of activities) {
        const group = activityGroups[activity] || "其他事项";
        if (!groups.includes(group)) groups.push(group);
      }
      if (!groups.length) return "—";
      return `${groups.slice(0, 3).join(" · ")}${groups.length > 3 ? " · 等" : ""}`;
    }

    function setPlaceholder() {
      solarDate.textContent = "—";
      lunarDate.textContent = "—";
      lunarYear.textContent = "—";
      ganzhi.textContent = "—";
      zodiac.textContent = "—";
      yiSummary.textContent = "—";
      yiOriginal.textContent = "—";
      jiSummary.textContent = "—";
      jiOriginal.textContent = "—";
    }

    function updateAlmanac() {
      try {
        if (typeof Lunar === "undefined") throw new Error("Lunar library unavailable");

        const now = new Date();
        const lunar = Lunar.fromDate(now);
        const monthPrefix = lunar.getMonth() < 0 ? "闰" : "";

        solarDate.textContent = dateFormatter.format(now);
        lunarDate.textContent = `农历${monthPrefix}${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
        lunarYear.textContent = `${lunar.getYearInGanZhi()}年`;
        ganzhi.textContent = `${lunar.getMonthInGanZhi()}月 · ${lunar.getDayInGanZhi()}日`;
        zodiac.textContent = lunar.getYearShengXiao();
        const yiActivities = lunar.getDayYi();
        const jiActivities = lunar.getDayJi();
        yiSummary.textContent = activitySummary(yiActivities);
        yiOriginal.textContent = yiActivities.join(" · ");
        jiSummary.textContent = activitySummary(jiActivities);
        jiOriginal.textContent = jiActivities.join(" · ");
      } catch {
        setPlaceholder();
      }
    }

    function scheduleNextDateUpdate() {
      const now = new Date();
      const nextMidnight = new Date(now);
      nextMidnight.setHours(24, 0, 1, 0);
      window.setTimeout(() => {
        updateAlmanac();
        scheduleNextDateUpdate();
      }, nextMidnight.getTime() - now.getTime());
    }

    updateAlmanac();
    scheduleNextDateUpdate();
  </script>
</body>
</html>
