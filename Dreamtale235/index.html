<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dreamtale235 Chronicle">
  <title>Dreamtale235 — Chronicle</title>
  <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Serif:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #10100f;
      --paper: #f3f0e9;
      --muted: #c9c5bc;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: clamp(2rem, 8vw, 6rem) 1.5rem;
      background: var(--ink);
      color: var(--paper);
      text-align: center;
    }

    main { display: grid; gap: 1rem; }

    h1, p { margin: 0; }

    h1 {
      font-family: "Noto Serif", Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif;
      font-size: clamp(3.75rem, 13vw, 8.5rem);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 0.95;
    }

    p {
      color: var(--muted);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(0.8rem, 1.5vw, 0.95rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .portal-entry {
      position: fixed;
      bottom: max(clamp(1.5rem, 4vw, 2.5rem), env(safe-area-inset-bottom));
      left: 50%;
      display: grid;
      width: 3rem;
      height: 3rem;
      place-items: center;
      transform: translateX(-50%);
      color: var(--muted);
      font-family: "Segoe UI Symbol", "Apple Symbols", sans-serif;
      font-size: 1.7rem;
      line-height: 1;
      text-decoration: none;
    }

    .portal-entry:hover { color: var(--paper); }

    .portal-entry:focus-visible {
      outline: 1px solid var(--paper);
      outline-offset: 0.25rem;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <main>
    <h1>Dreamtale235</h1>
    <p>Chronicle</p>
  </main>
  <a class="portal-entry" href="/start/" aria-label="Return to the start page">⊙</a>
</body>
</html>
